<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="742" viewBox="0 0 1200 742" font-family="'Malgun Gothic','Noto Sans KR','Apple SD Gothic Neo',sans-serif">
<title>모형시험 DB 중심 업무 프로그램화와 챗봇 순환</title>
<rect x="0" y="0" width="1200" height="742" fill="#f6f5f2"/>
<text x="40.0" y="48.0" font-size="24" fill="#1f2328" font-weight="700">모형시험 DB 중심 업무 프로그램화와 챗봇 순환</text>
<text x="40.0" y="76.0" font-size="14" fill="#5b6370">모형시험 DB에서 파생되는 작업을 프로그램 기능으로 만들고, 기능마다 챗봇 도구를 붙여 실행합니다. 결과는 다시 쌓여 다음 작업의 바탕이 됩니다.</text>
<circle cx="400" cy="420" r="232" fill="none" stroke="#dfe5ee" stroke-width="26"/>
<path d="M539.6,234.7 A232,232 0 0 1 624.1,360.0" fill="none" stroke="#1d3557" stroke-width="3"/>
<polygon points="625.1,363.8 614.1,352.3 628.9,348.3" fill="#1d3557"/>
<path d="M624.1,480.0 A232,232 0 0 1 539.6,605.3" fill="none" stroke="#1d3557" stroke-width="3"/>
<polygon points="536.4,607.7 543.0,593.1 552.2,605.4" fill="#1d3557"/>
<path d="M260.4,605.3 A232,232 0 0 1 175.9,480.0" fill="none" stroke="#1d3557" stroke-width="3"/>
