<text x="828.0" y="408.0" font-size="12" fill="#5b6370">설계점 · 후보 · 중량</text>
<rect x="816.0" y="426.0" width="328" height="48" rx="6" fill="#eaf0f8"/>
<text x="828.0" y="446.0" font-size="13.5" fill="#1f2328" font-weight="600">LRM CAL · One Shaft · M&amp;S</text>
<text x="828.0" y="464.0" font-size="12" fill="#5b6370">엔진 한계선 · 단축 운항</text>
<rect x="816.0" y="482.0" width="328" height="48" rx="6" fill="#eaf0f8"/>
<text x="828.0" y="502.0" font-size="13.5" fill="#1f2328" font-weight="600">Deliverables 제공 기록</text>
<text x="828.0" y="520.0" font-size="12" fill="#5b6370">값 · 날짜 · 받는 곳 · 엑셀/PDF</text>
<rect x="816.0" y="538.0" width="328" height="48" rx="6" fill="#ffffff" stroke="#5b6370" stroke-width="1.2" stroke-dasharray="5 4"/>
<text x="828.0" y="558.0" font-size="13.5" fill="#5b6370" font-weight="700">+ 다음 파생 작업</text>
<text x="828.0" y="576.0" font-size="12" fill="#5b6370">같은 방식으로 기능화 → 도구 추가</text>
<line x1="531.0" y1="188.0" x2="790" y2="188.0" stroke="#1d3557" stroke-width="1.6" stroke-dasharray="5 4"/>
<polygon points="798.0,188.0 788.0,193.5 788.0,182.5" fill="#1d3557"/>
<text x="662.5" y="180.0" font-size="12" fill="#1d3557" font-weight="700" text-anchor="middle">지금까지 구현</text>
<text x="40.0" y="720.0" font-size="12" fill="#5b6370">2026-11-09 기준 구현 상태.</text>
</svg>
