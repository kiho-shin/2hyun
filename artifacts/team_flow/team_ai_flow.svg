<text x="828.0" y="240.0" font-size="12" fill="#5b6370">시험 기반 속도·마력</text>
<rect x="816.0" y="258.0" width="328" height="48" rx="6" fill="#eaf0f8"/>
<text x="828.0" y="278.0" font-size="13.5" fill="#1f2328" font-weight="600">Rudder Torque</text>
<text x="828.0" y="296.0" font-size="12" fill="#5b6370">케이스 · PDF 양식 시트 · 유사선 초기설계</text>
<rect x="816.0" y="314.0" width="328" height="48" rx="6" fill="#eaf0f8"/>
<text x="828.0" y="334.0" font-size="13.5" fill="#1f2328" font-weight="600">Propeller Weight/MOI</text>
<text x="828.0" y="352.0" font-size="12" fill="#5b6370">ProDes 엔진 · 선급 Rule Check</text>
