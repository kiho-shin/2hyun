<path d="M175.9,360.0 A232,232 0 0 1 260.4,234.7" fill="none" stroke="#1d3557" stroke-width="3"/>
<polygon points="263.6,232.3 257.0,246.9 247.8,234.6" fill="#1d3557"/>
<text x="150.0" y="242.0" font-size="12.5" fill="#1d3557" font-weight="700" text-anchor="middle">쌓인 결과로</text>
<text x="150.0" y="260.0" font-size="12.5" fill="#1d3557" font-weight="700" text-anchor="middle">다음 파생 작업</text>
<circle cx="400" cy="420" r="96" fill="#1d3557"/>
<text x="400.0" y="408.0" font-size="20" fill="#ffffff" font-weight="700" text-anchor="middle">모형시험 DB</text>
<text x="400.0" y="434.0" font-size="12.5" fill="#c9d6e8" text-anchor="middle">POW · 자항 · 반류</text>
<text x="400.0" y="453.0" font-size="12.5" fill="#c9d6e8" text-anchor="middle">풍동 · 저항</text>
<rect x="275.0" y="148.0" width="250" height="80" rx="9" fill="#eaf0f8" stroke="#1d3557" stroke-width="1.6"/>
<text x="400.0" y="181.0" font-size="15.5" fill="#1d3557" font-weight="700" text-anchor="middle">① 파생 작업 프로그램화</text>
<text x="400.0" y="204.0" font-size="12.5" fill="#5b6370" text-anchor="middle">시험 결과에서 나오는 계산을 기능으로</text>
<rect x="507.0" y="380.0" width="250" height="80" rx="9" fill="#fdf0e6" stroke="#d9580a" stroke-width="1.6"/>
<text x="632.0" y="413.0" font-size="15.5" fill="#d9580a" font-weight="700" text-anchor="middle">② 기능마다 도구 붙이기</text>
<text x="632.0" y="436.0" font-size="12.5" fill="#5b6370" text-anchor="middle">챗봇이 부를 수 있게 등록</text>
<rect x="275.0" y="612.0" width="250" height="80" rx="9" fill="#d9580a" stroke="#d9580a" stroke-width="1.6"/>
<text x="400.0" y="645.0" font-size="15.5" fill="#ffffff" font-weight="700" text-anchor="middle">③ 챗봇이 도구 실행</text>
<text x="400.0" y="668.0" font-size="12.5" fill="#ffe3cf" text-anchor="middle">질문 → 도구 실행 → 결과로 답</text>
<rect x="43.0" y="380.0" width="250" height="80" rx="9" fill="#eaf0f8" stroke="#1d3557" stroke-width="1.6"/>
<text x="168.0" y="413.0" font-size="15.5" fill="#1d3557" font-weight="700" text-anchor="middle">④ 결과 저장 · 축적</text>
